  function dismissLoadingScreen() {
    var loader = document.getElementById('appLoadingScreen');
    if (!loader) return;
    if (!loader.classList.contains('loading-dismissed')) {
      loader.classList.add('loading-dismissed');
      setTimeout(function() {
        loader.style.display = 'none';
      }, 900);
    }
  }

  function calculateFrustumBounds(camera, targetZ) {
    var dist = camera.position.z - (targetZ || 0);
    var vFov = (camera.fov * Math.PI) / 180;
    var height = 2 * Math.tan(vFov / 2) * dist;
    var width = height * camera.aspect;
    return { width: width, height: height };
  }

  function initThreeWebGLAtmosphere() {
    var canvas = document.getElementById('webglCanvas');
    if (!canvas || typeof THREE === 'undefined') return;

    try {
      threeEngine.canvas = canvas;
      threeEngine.clock = new THREE.Clock();
      threeEngine.crystals = [];

      var width = window.innerWidth;
      var height = window.innerHeight;
      var isMobile = width < 640;

      threeEngine.scene = new THREE.Scene();
      threeEngine.camera = new THREE.PerspectiveCamera(45, width / height, 1, 3500);
      threeEngine.camera.position.set(0, 0, isMobile ? 960 : 850);

      threeEngine.renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        alpha: true,
        antialias: true,
        powerPreference: 'high-performance'
      });
      threeEngine.renderer.setSize(width, height);
      threeEngine.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

      var ambientLight = new THREE.AmbientLight(0xffffff, 1.35);
      threeEngine.scene.add(ambientLight);

      var keyLight = new THREE.DirectionalLight(0xfff8ee, 2.2);
      keyLight.position.set(450, 580, 480);
      threeEngine.scene.add(keyLight);

      var fillLight = new THREE.DirectionalLight(0x7fb8f5, 1.65);
      fillLight.position.set(-460, -340, 240);
      threeEngine.scene.add(fillLight);

      var rimLight = new THREE.DirectionalLight(0xf59e0b, 1.3);
      rimLight.position.set(0, -420, -220);
      threeEngine.scene.add(rimLight);

      buildFrostedPolyhedraField();
      buildStardustField();

      window.addEventListener('resize', onThreeWindowResize);
      window.addEventListener('mousemove', onThreeMouseMove);
      window.addEventListener('touchmove', onThreeTouchMove, { passive: true });

      threeEngine.isInitialized = true;
      animateThreeWebGL();
    } catch (e) {
      console.warn('Three.js Polyhedra fallback active:', e);
    }
  }

  function buildFrostedPolyhedraField() {
    var isMobile = window.innerWidth < 640;
    var scaleFactor = isMobile ? 0.72 : 1.0;

    var polyConfigs = [
      { type: 'icosa', radius: 46 * scaleFactor, norm: [-0.38, 0.36, -60], color: 0xf0f7ff, rotSpeed: [0.006, 0.008, 0.005], floatAmp: 14, floatFreq: 0.8 },
      { type: 'octa', radius: 32 * scaleFactor, norm: [-0.44, 0.22, -140], color: 0xdbeafe, rotSpeed: [-0.007, 0.009, 0.004], floatAmp: 11, floatFreq: 1.1 },
      { type: 'dodeca', radius: 26 * scaleFactor, norm: [-0.22, 0.44, -100], color: 0x244b78, rotSpeed: [0.005, -0.006, 0.007], floatAmp: 16, floatFreq: 0.7 },
      { type: 'octa', radius: 44 * scaleFactor, norm: [0.38, 0.36, -50], color: 0xf0f7ff, rotSpeed: [-0.006, -0.008, 0.005], floatAmp: 15, floatFreq: 0.9 },
      { type: 'icosa', radius: 34 * scaleFactor, norm: [0.44, 0.22, -150], color: 0xdbeafe, rotSpeed: [0.008, -0.007, -0.004], floatAmp: 12, floatFreq: 1.2 },
      { type: 'tetra', radius: 26 * scaleFactor, norm: [0.22, 0.44, -120], color: 0x386fa8, rotSpeed: [0.007, 0.009, -0.006], floatAmp: 17, floatFreq: 0.75 },
      { type: 'octa', radius: 36 * scaleFactor, norm: [-0.44, -0.08, -50], color: 0x1c3b5e, rotSpeed: [-0.005, 0.007, -0.006], floatAmp: 13, floatFreq: 0.85 },
      { type: 'dodeca', radius: 42 * scaleFactor, norm: [-0.38, -0.32, -90], color: 0xf0f7ff, rotSpeed: [0.006, -0.005, 0.008], floatAmp: 16, floatFreq: 0.95 },
      { type: 'icosa', radius: 28 * scaleFactor, norm: [-0.22, -0.42, -140], color: 0xdbeafe, rotSpeed: [-0.008, 0.006, 0.005], floatAmp: 10, floatFreq: 1.3 },
      { type: 'icosa', radius: 38 * scaleFactor, norm: [0.44, -0.08, -60], color: 0x244b78, rotSpeed: [0.005, -0.008, 0.006], floatAmp: 14, floatFreq: 0.9 },
      { type: 'octa', radius: 42 * scaleFactor, norm: [0.38, -0.32, -100], color: 0xf0f7ff, rotSpeed: [-0.007, 0.006, -0.007], floatAmp: 15, floatFreq: 1.05 },
      { type: 'dodeca', radius: 30 * scaleFactor, norm: [0.22, -0.42, -130], color: 0xdbeafe, rotSpeed: [0.009, -0.005, 0.006], floatAmp: 11, floatFreq: 1.15 },
      { type: 'tetra', radius: 22 * scaleFactor, norm: [-0.15, 0.32, -320], color: 0x386fa8, rotSpeed: [0.004, 0.005, 0.004], floatAmp: 9, floatFreq: 0.6 },
      { type: 'octa', radius: 24 * scaleFactor, norm: [0.15, 0.32, -310], color: 0x1c3b5e, rotSpeed: [-0.005, 0.006, -0.004], floatAmp: 9, floatFreq: 0.65 }
    ];

    for (var i = 0; i < polyConfigs.length; i++) {
      var cfg = polyConfigs[i];
      var group = createSinglePolyhedron(cfg);
      threeEngine.scene.add(group);

      var bounds = calculateFrustumBounds(threeEngine.camera, cfg.norm[2]);
      var posX = cfg.norm[0] * bounds.width;
      var posY = cfg.norm[1] * bounds.height;
      var posZ = cfg.norm[2];
      group.position.set(posX, posY, posZ);

      threeEngine.crystals.push({
        group: group,
        normPos: cfg.norm,
        basePos: new THREE.Vector3(posX, posY, posZ),
        rotSpeed: cfg.rotSpeed,
        floatAmp: cfg.floatAmp,
        floatFreq: cfg.floatFreq,
        phase: i * 0.48
      });
    }
  }

  function createSinglePolyhedron(cfg) {
    var group = new THREE.Group();
    var geo;

    switch (cfg.type) {
      case 'icosa': geo = new THREE.IcosahedronGeometry(cfg.radius, 0); break;
      case 'octa': geo = new THREE.OctahedronGeometry(cfg.radius, 0); break;
      case 'dodeca': geo = new THREE.DodecahedronGeometry(cfg.radius, 0); break;
      case 'tetra': geo = new THREE.TetrahedronGeometry(cfg.radius, 0); break;
      default: geo = new THREE.IcosahedronGeometry(cfg.radius, 0);
    }

    var isDarkJewel = (cfg.color === 0x1c3b5e || cfg.color === 0x244b78 || cfg.color === 0x386fa8);

    var bodyMat = new THREE.MeshPhysicalMaterial({
      color: cfg.color,
      roughness: isDarkJewel ? 0.12 : 0.18,
      metalness: isDarkJewel ? 0.32 : 0.14,
      transmission: isDarkJewel ? 0.58 : 0.82,
      transparent: true,
      opacity: isDarkJewel ? 0.92 : 0.82,
      reflectivity: 0.98,
      clearcoat: 1.0,
      clearcoatRoughness: 0.05,
      ior: 1.54,
      side: THREE.DoubleSide
    });

    var mesh = new THREE.Mesh(geo, bodyMat);
    group.add(mesh);

    var edgeGeo = new THREE.EdgesGeometry(geo);
    var edgeMat = new THREE.LineBasicMaterial({
      color: 0xf59e0b,
      linewidth: 2,
      transparent: true,
      opacity: 0.98
    });
    var edges = new THREE.LineSegments(edgeGeo, edgeMat);
    group.add(edges);

    var innerCoreGeo = new THREE.SphereGeometry(cfg.radius * 0.22, 12, 12);
    var innerCoreMat = new THREE.MeshBasicMaterial({
      color: isDarkJewel ? 0xf59e0b : 0x93c5fd,
      transparent: true,
      opacity: 0.55
    });
    var core = new THREE.Mesh(innerCoreGeo, innerCoreMat);
    group.add(core);

    group.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
    return group;
  }

  function buildStardustField() {
    var count = window.innerWidth < 640 ? 320 : 680;
    var geo = new THREE.BufferGeometry();
    var positions = new Float32Array(count * 3);
    var colors = new Float32Array(count * 3);

    var colGold = new THREE.Color(0xf59e0b);
    var colIce = new THREE.Color(0x60a5fa);
    var colWhite = new THREE.Color(0xffffff);

    for (var i = 0; i < count; i++) {
      var i3 = i * 3;
      positions[i3] = (Math.random() - 0.5) * 1650;
      positions[i3 + 1] = (Math.random() - 0.5) * 1250;
      positions[i3 + 2] = (Math.random() - 0.5) * 750 - 100;

      var chosen = Math.random() < 0.25 ? colGold : (Math.random() < 0.6 ? colIce : colWhite);
      colors[i3] = chosen.r;
      colors[i3 + 1] = chosen.g;
      colors[i3 + 2] = chosen.b;
    }

    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    var glowTexture = createParticleGlowTexture();
    var material = new THREE.PointsMaterial({
      size: 14,
      map: glowTexture,
      vertexColors: true,
      transparent: true,
      opacity: 0.72,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    threeEngine.stardustParticles = new THREE.Points(geo, material);
    threeEngine.scene.add(threeEngine.stardustParticles);
  }

  function createParticleGlowTexture() {
    var canvas = document.createElement('canvas');
    canvas.width = 64;
    canvas.height = 64;
    var ctx = canvas.getContext('2d');

    var grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
    grad.addColorStop(0.35, 'rgba(163, 202, 246, 0.85)');
    grad.addColorStop(0.7, 'rgba(40, 83, 130, 0.25)');
    grad.addColorStop(1, 'rgba(18, 37, 60, 0)');

    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 64, 64);

    var texture = new THREE.Texture(canvas);
    texture.needsUpdate = true;
    return texture;
  }

  function onThreeMouseMove(e) {
    threeEngine.mouse.targetX = (e.clientX / window.innerWidth) * 2 - 1;
    threeEngine.mouse.targetY = -(e.clientY / window.innerHeight) * 2 + 1;
  }

  function onThreeTouchMove(e) {
    if (e.touches && e.touches[0]) {
      threeEngine.mouse.targetX = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
      threeEngine.mouse.targetY = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
    }
  }

  function onThreeWindowResize() {
    if (!threeEngine.renderer || !threeEngine.camera) return;
    var w = window.innerWidth;
    var h = window.innerHeight;
    var isMobile = w < 640;

    threeEngine.camera.aspect = w / h;
    threeEngine.camera.position.z = isMobile ? 960 : 850;
    threeEngine.camera.updateProjectionMatrix();

    threeEngine.renderer.setSize(w, h);
    threeEngine.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

    for (var i = 0; i < threeEngine.crystals.length; i++) {
      var item = threeEngine.crystals[i];
      var bounds = calculateFrustumBounds(threeEngine.camera, item.normPos[2]);
      item.basePos.x = item.normPos[0] * bounds.width;
      item.basePos.y = item.normPos[1] * bounds.height;

      var scale = isMobile ? 0.72 : 1.0;
      item.group.scale.set(scale, scale, scale);
    }
  }

  function animateThreeWebGL() {
    if (!threeEngine.isInitialized) return;
    requestAnimationFrame(animateThreeWebGL);

    var time = threeEngine.clock.getElapsedTime();

    threeEngine.mouse.x += (threeEngine.mouse.targetX - threeEngine.mouse.x) * 0.045;
    threeEngine.mouse.y += (threeEngine.mouse.targetY - threeEngine.mouse.y) * 0.045;

    for (var i = 0; i < threeEngine.crystals.length; i++) {
      var item = threeEngine.crystals[i];
      var grp = item.group;

      grp.rotation.x += item.rotSpeed[0];
      grp.rotation.y += item.rotSpeed[1];
      grp.rotation.z += item.rotSpeed[2];

      var floatOffset = Math.sin(time * item.floatFreq + item.phase) * item.floatAmp;
      grp.position.y = item.basePos.y + floatOffset;

      var depthFactor = (1200 + item.basePos.z) / 1200;
      grp.position.x = item.basePos.x + (threeEngine.mouse.x * 24 * depthFactor);
    }

    if (threeEngine.stardustParticles) {
      threeEngine.stardustParticles.rotation.y = time * 0.018;
      threeEngine.stardustParticles.rotation.x = Math.sin(time * 0.012) * 0.035;
    }

    threeEngine.renderer.render(threeEngine.scene, threeEngine.camera);
  }

  function formatGoogleDriveImageUrl(url) {
    if (!url) {
      return 'https://images.unsplash.com/photo-1523240795612-9a054b0db644?w=1000&auto=format&fit=crop&q=80';
    }
    var str = String(url).trim();
    var match = str.match(/(?:id=|\/d\/|file\/d\/|open\?id=)([a-zA-Z0-9_-]{20,})/);
    var fileId = match ? match[1] : null;

    if (!fileId && /^[a-zA-Z0-9_-]{20,50}$/.test(str)) {
      fileId = str;
    }

    if (fileId) {
      return 'https://drive.google.com/thumbnail?id=' + fileId + '&sz=w1200';
    }

    return str;
  }

  function handleImageFallback(imgEl, originalUrl) {
    if (!imgEl) return;
    var retryCount = parseInt(imgEl.getAttribute('data-retry') || '0', 10);
    var match = (originalUrl || '').match(/(?:id=|\/d\/|file\/d\/|open\?id=)([a-zA-Z0-9_-]{20,})/);
    var fileId = match ? match[1] : ((originalUrl && /^[a-zA-Z0-9_-]{20,50}$/.test(originalUrl)) ? originalUrl : null);

    if (fileId && retryCount === 0) {
      imgEl.setAttribute('data-retry', '1');
      imgEl.src = 'https://lh3.googleusercontent.com/d/' + fileId + '=w1200';
    } else if (fileId && retryCount === 1) {
      imgEl.setAttribute('data-retry', '2');
      imgEl.src = 'https://drive.google.com/uc?export=view&id=' + fileId;
    } else {
      imgEl.onerror = null;
      imgEl.src = 'https://images.unsplash.com/photo-1523240795612-9a054b0db644?w=1000&auto=format&fit=crop&q=80';
    }
  }

  function playSynthesizedShutterSound() {
    try {
      var AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      var ctx = new AudioCtx();

      var osc = ctx.createOscillator();
      var gain = ctx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(820, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(140, ctx.currentTime + 0.08);

      gain.gain.setValueAtTime(0.35, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.12);

      setTimeout(function() {
        var osc2 = ctx.createOscillator();
        var gain2 = ctx.createGain();

        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(640, ctx.currentTime);
        osc2.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.09);

        gain2.gain.setValueAtTime(0.28, ctx.currentTime);
        gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);

        osc2.connect(gain2);
        gain2.connect(ctx.destination);

        osc2.start(ctx.currentTime);
        osc2.stop(ctx.currentTime + 0.1);
      }, 70);
    } catch (err) {
      console.warn('Audio Synthesis Guardrail:', err);
    }
  }

  function navigateTo(pageId) {
    if (appState.currentPage === pageId) {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      rearmAndTriggerPageAnimations(pageId);
      return;
    }

    if (appState.currentPage === 'photobooth' && pageId !== 'photobooth') {
      stopWebcamStream();
      restoreHeader();
    }

    var currentActive = document.querySelector('.page-section.active-page');

    if (currentActive && currentActive.id !== 'page-' + pageId) {
      currentActive.classList.add('page-exiting');
      setTimeout(function() {
        currentActive.classList.remove('active-page', 'page-exiting');
        performPageEntrance(pageId);
      }, 140);
    } else {
      performPageEntrance(pageId);
    }
  }

  function performPageEntrance(pageId) {
    appState.currentPage = pageId;

    if (pageId !== 'news') {
      closeNewsDetail();
    }

    var sections = document.querySelectorAll('.page-section');
    sections.forEach(function(sec) { sec.classList.remove('active-page', 'page-exiting'); });

    var target = document.getElementById('page-' + pageId);
    if (target) {
      target.classList.add('active-page');
    }

    var navButtons = document.querySelectorAll('.nav-link-item');
    navButtons.forEach(function(btn) { btn.classList.remove('active-nav-link'); });

    var activeNavBtn = document.getElementById('nav-' + pageId);
    if (activeNavBtn) activeNavBtn.classList.add('active-nav-link');

    var globalFooter = document.getElementById('mainGlobalFooter');
    if (globalFooter) {
      if (pageId === 'home' || pageId === 'photobooth') {
        globalFooter.classList.add('hidden');
      } else {
        globalFooter.classList.remove('hidden');
      }
    }

    updateNavUnderline();
    window.scrollTo({ top: 0, behavior: 'instant' });

    var scrollBar = document.getElementById('scrollProgressBar');
    if (scrollBar) scrollBar.style.width = '0%';

    setTimeout(function() {
      rearmAndTriggerPageAnimations(pageId);
    }, 20);
  }

  function rearmAndTriggerPageAnimations(pageId) {
    if (pageId === 'home' || pageId === 'photobooth') return;

    var pageEl = document.getElementById('page-' + pageId);
    if (!pageEl) return;

    var reveals = pageEl.querySelectorAll('.scroll-reveal');
    var winHeight = window.innerHeight || document.documentElement.clientHeight;

    reveals.forEach(function(el) {
      el.style.transition = 'none';
      el.style.transitionDelay = '0ms';
      el.classList.remove('scroll-reveal-visible');
    });

    void pageEl.offsetHeight;

    reveals.forEach(function(el) {
      el.style.transition = '';
    });

    var inViewIndex = 0;
    reveals.forEach(function(el) {
      var rect = el.getBoundingClientRect();
      if (rect.top < winHeight * 0.95 && rect.bottom > 0) {
        el.style.transitionDelay = (inViewIndex * 65) + 'ms';
        inViewIndex++;
      } else {
        el.style.transitionDelay = '0ms';
      }
    });

    void pageEl.offsetHeight;

    requestAnimationFrame(function() {
      reveals.forEach(function(el) {
        var rect = el.getBoundingClientRect();
        if (rect.top < winHeight * 0.95 && rect.bottom > 0) {
          el.classList.add('scroll-reveal-visible');
        }
      });
    });

    setTimeout(function() {
      reveals.forEach(function(el) {
        el.style.transitionDelay = '';
      });
    }, (inViewIndex * 65) + 650);

    if (pageId === 'about') {
      var beam = document.getElementById('milestoneTrackBeamGlow');
      if (beam) beam.style.width = '0%';
      for (var i = 1; i <= 4; i++) {
        var card = document.getElementById('milestone-card-' + i);
        if (card) card.classList.remove('border-hydrangea-500', 'shadow-md');
      }
      setTimeout(function() {
        playMilestoneSequence();
      }, 120);
    }
  }

  function updateNavUnderline() {
    var activeBtn = document.getElementById('nav-' + appState.currentPage);
    var underline = document.getElementById('navSlidingUnderline');
    var container = document.getElementById('navMenuContainer');
    if (!activeBtn || !underline || !container) return;

    var leftPos = activeBtn.offsetLeft;
    var btnWidth = activeBtn.offsetWidth;

    underline.style.left = leftPos + 'px';
    underline.style.width = btnWidth + 'px';
  }

  function toggleMobileMenu() {
    var drawer = document.getElementById('mobileDrawer');
    var hamb1 = document.getElementById('hambLine1');
    var hamb2 = document.getElementById('hambLine2');
    var hamb3 = document.getElementById('hambLine3');

    appState.mobileMenuOpen = !appState.mobileMenuOpen;

    if (drawer) {
      if (appState.mobileMenuOpen) {
        drawer.classList.remove('hidden');
      } else {
        drawer.classList.add('hidden');
      }
    }

    if (hamb1 && hamb2 && hamb3) {
      if (appState.mobileMenuOpen) {
        hamb1.style.transform = 'translateY(6px) rotate(45deg)';
        hamb2.style.opacity = '0';
        hamb3.style.transform = 'translateY(-6px) rotate(-45deg)';
      } else {
        hamb1.style.transform = 'none';
        hamb2.style.opacity = '1';
        hamb3.style.transform = 'none';
      }
    }
  }

  function handleNavbarScroll() {
    var navPill = document.getElementById('mainNavbarPill');
    if (navPill) {
      if (window.scrollY > 30) {
        navPill.classList.add('navbar-scrolled');
      } else {
        navPill.classList.remove('navbar-scrolled');
      }
    }

    var progressBar = document.getElementById('scrollProgressBar');
    if (progressBar) {
      var winScroll = document.documentElement.scrollTop || document.body.scrollTop;
      var height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      var scrolled = height > 0 ? (winScroll / height) * 100 : 0;
      progressBar.style.width = Math.min(Math.max(scrolled, 0), 100) + '%';
    }

    var btnTop = document.getElementById('btnScrollToTop');
    if (btnTop) {
      if (window.scrollY > 350 && appState.currentPage !== 'home' && appState.currentPage !== 'photobooth') {
        btnTop.classList.remove('hidden');
      } else {
        btnTop.classList.add('hidden');
      }
    }
  }

  function scrollToTopSmooth() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function initScrollReveal() {
    if (!('IntersectionObserver' in window)) {
      var allReveals = document.querySelectorAll('.scroll-reveal');
      allReveals.forEach(function(el) { el.classList.add('scroll-reveal-visible'); });
      return;
    }

    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('scroll-reveal-visible');
        }
      });
    }, { 
      threshold: 0.08,
      rootMargin: '0px 0px -40px 0px'
    });

    var targets = document.querySelectorAll('.scroll-reveal');
    targets.forEach(function(t) { observer.observe(t); });
  }

  function initInteractiveMilestones() {
    var container = document.getElementById('milestoneSectionContainer');
    if (!container) return;

    if ('IntersectionObserver' in window) {
      var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting) {
            playMilestoneSequence();
          }
        });
      }, { threshold: 0.2 });
      observer.observe(container);
    } else {
      activateMilestoneStep(4);
    }
  }

  function playMilestoneSequence() {
    activateMilestoneStep(1);
    setTimeout(function() { activateMilestoneStep(2); }, 350);
    setTimeout(function() { activateMilestoneStep(3); }, 700);
    setTimeout(function() { activateMilestoneStep(4); }, 1050);
  }

  function activateMilestoneStep(stepNum) {
    var beam = document.getElementById('milestoneTrackBeamGlow');
    if (beam) {
      var percentages = { 1: '25%', 2: '50%', 3: '75%', 4: '100%' };
      beam.style.width = percentages[stepNum] || '100%';
    }

    for (var i = 1; i <= 4; i++) {
      var card = document.getElementById('milestone-card-' + i);
      if (card) {
        if (i <= stepNum) {
          card.classList.add('border-hydrangea-500', 'shadow-md');
        } else {
          card.classList.remove('border-hydrangea-500', 'shadow-md');
        }
      }
    }
  }

  function initSilkTilt() {
    var cards = document.querySelectorAll('.silk-tilt-card');
    cards.forEach(function(card) {
      card.addEventListener('mousemove', function(e) {
        var rect = card.getBoundingClientRect();
        var x = e.clientX - rect.left;
        var y = e.clientY - rect.top;
        var centerX = rect.width / 2;
        var centerY = rect.height / 2;
        var rotateX = ((y - centerY) / centerY) * -6;
        var rotateY = ((x - centerX) / centerX) * 6;
        card.style.transform = 'perspective(1000px) rotateX(' + rotateX.toFixed(2) + 'deg) rotateY(' + rotateY.toFixed(2) + 'deg) translateY(-4px)';
      });

      card.addEventListener('mouseleave', function() {
        card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0px)';
      });
    });
  }

  function renderDynamicMinistries(rawCabinetMembers) {
    var container = document.getElementById('sequentialMinistriesContainer');

    var groupedMap = {};

      var row = rawCabinetMembers[i];

      if (!groupedMap[mKey]) {

          title: mKey,
          desc: row.desc || 'Menjalankan amanat tugas pokok dan fungsi kementerian di lingkungan BES SAPA AL HIJRAH.',
          icon: row.icon || 'default',
          order: row.order || 99,
          members: []

        ministryOrder.push(mKey);

      if (row.name) {
        groupedMap[mKey].members.push({
          role: row.position || 'Staff',
          name: row.name

    var html = '';

    for (var m = 0; m < ministryOrder.length; m++) {

  function updateCarouselVisuals() {
    var templates = appState.photobooth.templates;
    var center = appState.photobooth.centerTemplate;

    var map = {
      'diplomatic': document.getElementById('card-diplomatic'),
      'analog': document.getElementById('card-analog'),
      'herbarium': document.getElementById('card-herbarium')
    };

    templates.forEach(function(tKey, idx) {
      var el = map[tKey];
      if (el) {
        el.style.order = idx;
        el.classList.remove('item-center', 'item-side');
        if (tKey === center) {
          el.classList.add('item-center');
        } else {
          el.classList.add('item-side');
        }
      }
    });

    if (appState.photobooth.cameraReady && appState.photobooth.stream) {
      mountVideoToActiveCenterSlot(appState.photobooth.currentPoseIndex + 1);
    } else {
      renderInSlotCameraNotice();
    }
  }

  function revolveToTemplate(targetKey) {
    if (appState.photobooth.isBusy) return;
    if (appState.photobooth.centerTemplate === targetKey) return;

    var templates = appState.photobooth.templates;
    var targetIdx = templates.indexOf(targetKey);
    if (targetIdx === -1) return;

    if (targetIdx === 0) {
      var last = templates.pop();
      templates.unshift(last);
    } else if (targetIdx === 2) {
      var first = templates.shift();
      templates.push(first);
    }

    appState.photobooth.centerTemplate = targetKey;
    appState.photobooth.currentPoseIndex = 0;
    updateCarouselVisuals();

    var btnDl = document.getElementById('btnDownloadStrip');
    if (btnDl && !appState.photobooth.photos[targetKey][2]) {
      btnDl.classList.add('hidden');
      btnDl.disabled = true;
    }
  }

  function revolveNextTemplate() {

    revolveToTemplate(templates[2]);

  function requestCameraAccess() {
    var btnStart = document.getElementById('btnStartPhotoSequence');
    var btnStartText = document.getElementById('btnStartText');

    appState.photobooth.cameraReady = false;

    if (btnStart) {
      btnStart.disabled = true;

    }
    if (btnStartText) btnStartText.textContent = 'Menghubungkan Kamera...';

    renderInSlotCameraNotice();

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      handleCameraDenied();
      return;
    }

    stopWebcamStream();

    var constraints = {
      video: {
        facingMode: appState.photobooth.facingMode,
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    };

    navigator.mediaDevices.getUserMedia(constraints)
      .then(function(stream) { handleCameraStreamSuccess(stream); })
      .catch(function() {
        navigator.mediaDevices.getUserMedia({ video: true, audio: false })
          .then(function(stream) { handleCameraStreamSuccess(stream); })
          .catch(function() { handleCameraDenied(); });
      });
  }

  function mountVideoToActiveCenterSlot(slotNum) {
    var centerKey = appState.photobooth.centerTemplate;
    var slotId = 'slot-' + centerKey + '-' + slotNum;
    var slot = document.getElementById(slotId);
    if (!slot || !appState.photobooth.stream) return;

    slot.innerHTML = '';
    var video = document.createElement('video');
    video.autoplay = true;
    video.playsInline = true;
    video.muted = true;
    video.srcObject = appState.photobooth.stream;
    video.className = 'w-full h-full object-cover live-filter-' + appState.photobooth.activeFilter;
    video.onloadedmetadata = function() { video.play(); };

    slot.appendChild(video);
  }

  function startPhotoSequence() {
    if (appState.photobooth.isBusy || !appState.photobooth.cameraReady) {
      showToast('Kamera belum aktif!', 'warning');
      return;
    }

    var centerKey = appState.photobooth.centerTemplate;
    appState.photobooth.isBusy = true;
    appState.photobooth.photos[centerKey] = [null, null, null];
    appState.photobooth.currentPoseIndex = 0;

    var btnStart = document.getElementById('btnStartPhotoSequence');
    if (btnStart) {
      btnStart.disabled = true;
      btnStart.classList.add('opacity-50', 'cursor-not-allowed');
    }

    executeSlotCapture(0, function() {
      executeSlotCapture(1, function() {
        executeSlotCapture(2, function() {
          appState.photobooth.isBusy = false;
          if (btnStart) {
            btnStart.disabled = false;
            btnStart.classList.remove('opacity-50', 'cursor-not-allowed');
          }
          var btnStartText = document.getElementById('btnStartText');
          if (btnStartText) btnStartText.textContent = 'Foto Ulang 3 Pose 🔄';

          var btnDl = document.getElementById('btnDownloadStrip');
          if (btnDl) {
            btnDl.classList.remove('hidden');
            btnDl.disabled = false;
          }
          showToast('Alhamdulillah! 3 pose berhasil diambil.', 'success');
        });
      });
    });
  }

  function executeSlotCapture(slotIndex, onCompleted) {
    appState.photobooth.currentPoseIndex = slotIndex;
    mountVideoToActiveCenterSlot(slotIndex + 1);

    var centerKey = appState.photobooth.centerTemplate;
    var slotId = 'slot-' + centerKey + '-' + (slotIndex + 1);
    var slot = document.getElementById(slotId);

    var overlay = document.createElement('div');
    overlay.className = 'countdown-badge-overlay';
    overlay.textContent = '3';
    if (slot) slot.appendChild(overlay);

    var count = 3;
    var interval = setInterval(function() {
      count--;
      if (count > 0) {
        overlay.textContent = count;
      } else {
        clearInterval(interval);
        if (overlay.parentNode) overlay.parentNode.removeChild(overlay);

        triggerFlash();
        playSynthesizedShutterSound();
        captureFromActiveVideo(slotIndex);

        setTimeout(function() { onCompleted(); }, 800);
      }
    }, 1000);
  }

  function triggerFlash() {
    var flash = document.getElementById('cameraFlash');
    if (flash) {
      flash.classList.remove('hidden');
      flash.classList.add('flash-active');
      setTimeout(function() {
        flash.classList.add('hidden');
        flash.classList.remove('flash-active');
      }, 300);
    }
  }

  function captureFromActiveVideo(slotIndex) {
    var centerKey = appState.photobooth.centerTemplate;
    var slotId = 'slot-' + centerKey + '-' + (slotIndex + 1);
    var slot = document.getElementById(slotId);
    var video = slot ? slot.querySelector('video') : null;

    // Resolusi HD 4:3 presisi (640x480)
    var canvas = document.createElement('canvas');
    canvas.width = 640;
    canvas.height = 480;
    var ctx = canvas.getContext('2d');

    var currentFilter = appState.photobooth.activeFilter;
    if (currentFilter === 'warm') {
      ctx.filter = 'sepia(0.2) saturate(1.25) brightness(1.04)';
    } else if (currentFilter === 'noir') {
      ctx.filter = 'grayscale(1) contrast(1.2) brightness(0.96)';
    } else {
      ctx.filter = 'none';
    }

    if (video && video.videoWidth > 0 && video.videoHeight > 0) {
      var vw = video.videoWidth;
      var vh = video.videoHeight;
      var targetAspect = canvas.width / canvas.height; // 4:3 = 1.3333
      var videoAspect = vw / vh;

      var sx = 0, sy = 0, sw = vw, sh = vh;

      // Smart Aspect-Ratio Center-Crop Math: Menjamin wajah bulat alami dan anti-gepeng di HP mana pun
      if (videoAspect > targetAspect) {
        sw = vh * targetAspect;
        sh = vh;
        sx = (vw - sw) / 2;
        sy = 0;
      } else {
        sw = vw;
        sh = vw / targetAspect;
        sx = 0;
        sy = (vh - sh) / 2;
      }

      ctx.save();
      if (appState.photobooth.facingMode === 'user') {
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
      ctx.restore();
    } else {
      ctx.fillStyle = '#183354';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 24px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('BES AL HIJRAH', canvas.width / 2, canvas.height / 2);
    }

    var dataUrl = canvas.toDataURL('image/jpeg', 0.95);
    appState.photobooth.photos[centerKey][slotIndex] = dataUrl;

    if (slot) {
      slot.innerHTML = '<img src="' + dataUrl + '" class="w-full h-full object-cover">';
    }
  }

  function downloadPhotoStrip() {
    var centerKey = appState.photobooth.centerTemplate;
    var photos = appState.photobooth.photos[centerKey];
    if (!photos[0] || !photos[1] || !photos[2]) {
      showToast('Ambil 3 foto terlebih dahulu!', 'warning');
      return;
    }

    var canvas = document.getElementById('exportCanvas');
    var ctx = canvas.getContext('2d');
    canvas.width = 600;
    canvas.height = 1650;

    var loadedCount = 0;
    var imageElements = [];

    for (var i = 0; i < 3; i++) {
      (function(index) {
        var img = new Image();
        img.onload = function() {
          loadedCount++;
          if (loadedCount === 3) {
            renderFinalExportCanvas(ctx, canvas, centerKey, imageElements);
          }
        };
        img.src = photos[index];
        imageElements.push(img);
      })(i);
    }
  }

  /**
   * Helper Universal ArcTo: Menggambar Jalur Persegi Panjang Membulat (Rounded Rect)
   * 100% Kompatibel di seluruh peramban HP & Desktop tanpa pernah menghasilkan kotak petak kaku
   */
  function drawRoundedRectPath(ctx, x, y, width, height, radius) {
    ctx.beginPath();
    var r = radius;
    if (width < 2 * r) r = width / 2;
    if (height < 2 * r) r = height / 2;
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + width, y, x + width, y + height, r);
    ctx.arcTo(x + width, y + height, x, y + height, r);
    ctx.arcTo(x, y + height, x, y, r);
    ctx.arcTo(x, y, x + width, y, r);
    ctx.closePath();
  }

  /**
   * Helper Universal: Memotong & Menggambar Foto dengan Sudut Membulat Halus (Rounded Photo)
   */
  function drawRoundedImage(ctx, img, x, y, width, height, radius) {
    ctx.save();
    drawRoundedRectPath(ctx, x, y, width, height, radius);
    ctx.clip();
    ctx.drawImage(img, x, y, width, height);
    ctx.restore();
  }

  /**
   * Engine Ekspor Kanvas Resolusi Tinggi:
   * Distribusi Vertikal Merata (Anti-Bolong Bawah), Bingkai Artistik, Tanpa Emote, & True WYSIWYG
   */
  function renderFinalExportCanvas(ctx, canvas, template, imgs) {
    // Dimensi slot foto besar & proporsional yang mengisi tinggi strip secara harmonis
    var slotWidth = 500;
    var slotHeight = 390;
    var slotX = (canvas.width - slotWidth) / 2; // 50px
    var startY = 168;
    var gap = 42;
    var photoRadius = 18;

    /* =========================================================================
     * TEMPLATE 1: RETRO VIEWFINDER STUDIO (35MM FILM STRIP) - 100% UTUH
     * ========================================================================= */
    if (template === 'analog') {
      var skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      skyGrad.addColorStop(0, '#e0f2fe');
      skyGrad.addColorStop(0.5, '#bae6fd');
      skyGrad.addColorStop(1, '#7dd3fc');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Bingkai luar strip membulat halus
      drawRoundedRectPath(ctx, 16, 16, canvas.width - 32, canvas.height - 32, 28);
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#0284c7';
      ctx.stroke();

      // Perforasi lubang rol film 35mm
      ctx.fillStyle = 'rgba(14, 74, 110, 0.35)';
      for (var p = 30; p < canvas.height - 30; p += 22) {
        ctx.fillRect(10, p, 10, 14);
        ctx.fillRect(canvas.width - 20, p, 10, 14);
      }

      // Header Jendela Bidik
      drawRoundedRectPath(ctx, canvas.width / 2 - 200, 42, 400, 48, 12);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#0284c7';
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(canvas.width / 2 - 160, 66, 6, 0, Math.PI * 2);
      ctx.fillStyle = '#ef4444';
      ctx.fill();

      ctx.fillStyle = '#0369a1';
      ctx.font = '900 16px monospace';
      ctx.textAlign = 'left';
      ctx.fillText('REC 00:26 • ISO 400 • F/2.8', canvas.width / 2 - 140, 72);

      ctx.fillStyle = '#0c4a6e';
      ctx.font = '900 28px "Plus Jakarta Sans", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('STUDIO ARCHIVE 2026', canvas.width / 2, 130);

      for (var a = 0; a < 3; a++) {
        var yAnalog = startY + a * (slotHeight + gap);
        
        // Backplate polaroid putih membulat
        drawRoundedRectPath(ctx, slotX - 8, yAnalog - 8, slotWidth + 16, slotHeight + 16, 20);
        ctx.fillStyle = '#ffffff';
        ctx.fill();

        // Render foto membulat halus
        drawRoundedImage(ctx, imgs[a], slotX, yAnalog, slotWidth, slotHeight, photoRadius);

        // Sudut Viewfinder Brackets
        ctx.lineWidth = 3.5;
        ctx.strokeStyle = '#0284c7';
        // Top Left
        ctx.beginPath(); ctx.moveTo(slotX + 14, yAnalog + 30); ctx.lineTo(slotX + 14, yAnalog + 14); ctx.lineTo(slotX + 30, yAnalog + 14); ctx.stroke();
        // Top Right
        ctx.beginPath(); ctx.moveTo(slotX + slotWidth - 30, yAnalog + 14); ctx.lineTo(slotX + slotWidth - 14, yAnalog + 14); ctx.lineTo(slotX + slotWidth - 14, yAnalog + 30); ctx.stroke();
        // Bottom Left
        ctx.beginPath(); ctx.moveTo(slotX + 14, yAnalog + slotHeight - 30); ctx.lineTo(slotX + 14, yAnalog + slotHeight - 14); ctx.lineTo(slotX + 30, yAnalog + slotHeight - 14); ctx.stroke();
        // Bottom Right
        ctx.beginPath(); ctx.moveTo(slotX + slotWidth - 30, yAnalog + slotHeight - 14); ctx.lineTo(slotX + slotWidth - 14, yAnalog + slotHeight - 14); ctx.lineTo(slotX + slotWidth - 14, yAnalog + slotHeight - 30); ctx.stroke();

        // Divider Studio Kamera
        if (a < 2) {
          var yDivA = yAnalog + slotHeight + (gap / 2);
          ctx.strokeStyle = 'rgba(2, 132, 199, 0.45)';
          ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(slotX + 20, yDivA); ctx.lineTo(slotX + slotWidth - 20, yDivA); ctx.stroke();

          drawRoundedRectPath(ctx, canvas.width / 2 - 95, yDivA - 14, 190, 28, 8);
          ctx.fillStyle = '#ffffff';
          ctx.fill();
          ctx.strokeStyle = '#0284c7';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          ctx.fillStyle = '#0369a1';
          ctx.font = '800 13px monospace';
          ctx.textAlign = 'center';
          ctx.fillText(a === 0 ? '[ 02 • FOCUS LOCK ]' : '[ 03 • EXPOSURE ]', canvas.width / 2, yDivA + 5);
        }
      }

      ctx.fillStyle = '#082f49';
      ctx.font = '900 22px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('BES-ALHIJRAH // 35MM OPTICAL CUTS', canvas.width / 2, 1530);

      ctx.fillStyle = '#0369a1';
      ctx.font = '700 15px monospace';
      ctx.fillText('OPTICAL ROLL 026 • BINTUJU TAPSEL', canvas.width / 2, 1565);

    /* =========================================================================
     * TEMPLATE 2: BOTANICAL SCRAPBOOK (KREM - ALBUM ANTIK DENGAN SIKU PENYANGGA FOTO)
     * ========================================================================= */
    } else if (template === 'herbarium') {
      ctx.fillStyle = '#f5eee2';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Lis ganda scrapbook membulat halus
      drawRoundedRectPath(ctx, 16, 16, canvas.width - 32, canvas.height - 32, 28);
      ctx.lineWidth = 7;
      ctx.strokeStyle = '#c8b79f';
      ctx.stroke();

      drawRoundedRectPath(ctx, 24, 24, canvas.width - 48, canvas.height - 48, 22);
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#a48c6f';
      ctx.stroke();

      // Selotip Washi Tape Artistik di Sudut
      ctx.fillStyle = 'rgba(214, 196, 174, 0.95)';
      ctx.fillRect(40, 36, 120, 32);
      ctx.fillRect(canvas.width - 160, canvas.height - 68, 120, 32);

      // Stempel Pos Resmi Pesantren
      drawRoundedRectPath(ctx, canvas.width - 165, 42, 120, 34, 6);
      ctx.strokeStyle = 'rgba(185, 28, 28, 0.7)';
      ctx.lineWidth = 2.5;
      ctx.stroke();
      ctx.fillStyle = '#b91c1c';
      ctx.font = '900 13px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('POSTAL // 2026', canvas.width - 105, 64);

      // Header Tipografi Megah & Padat
      ctx.fillStyle = '#2c251e';
      ctx.font = 'bold 36px "Playfair Display", Georgia, serif';
      ctx.textAlign = 'center';
      ctx.fillText('Sekolah Alam Al Hijrah', canvas.width / 2, 94);

      ctx.fillStyle = '#8c7b6b';
      ctx.font = 'italic 18px "Playfair Display", Georgia, serif';
      ctx.fillText('Herbarium Journal • Bintuju Tapsel', canvas.width / 2, 128);

      // 3 Foto Album Kenangan dengan Siku Penyangga Fisik Antik (Vintage Mounting Corners)
      for (var h = 0; h < 3; h++) {
        var yHerb = startY + h * (slotHeight + gap);
        
        // Backplate passe-partout karton tebal krem
        drawRoundedRectPath(ctx, slotX - 10, yHerb - 10, slotWidth + 20, slotHeight + 20, 22);
        ctx.fillStyle = '#faf7f2';
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = '#d4c5b2';
        ctx.stroke();

        // Render foto membulat halus
        drawRoundedImage(ctx, imgs[h], slotX, yHerb, slotWidth, slotHeight, photoRadius);

        // 4 Siku Penyangga Foto Vintage (Vintage Photo Mounting Corners)
        var cornerSize = 28;
        ctx.fillStyle = '#8c7355';
        // Siku Kiri Atas
        ctx.beginPath();
        ctx.moveTo(slotX, yHerb);
        ctx.lineTo(slotX + cornerSize, yHerb);
        ctx.lineTo(slotX, yHerb + cornerSize);
        ctx.closePath();
        ctx.fill();

        // Siku Kanan Atas
        ctx.beginPath();
        ctx.moveTo(slotX + slotWidth, yHerb);
        ctx.lineTo(slotX + slotWidth - cornerSize, yHerb);
        ctx.lineTo(slotX + slotWidth, yHerb + cornerSize);
        ctx.closePath();
        ctx.fill();

        // Siku Kiri Bawah
        ctx.beginPath();
        ctx.moveTo(slotX, yHerb + slotHeight);
        ctx.lineTo(slotX + cornerSize, yHerb + slotHeight);
        ctx.lineTo(slotX, yHerb + slotHeight - cornerSize);
        ctx.closePath();
        ctx.fill();

        // Siku Kanan Bawah
        ctx.beginPath();
        ctx.moveTo(slotX + slotWidth, yHerb + slotHeight);
        ctx.lineTo(slotX + slotWidth - cornerSize, yHerb + slotHeight);
        ctx.lineTo(slotX + slotWidth, yHerb + slotHeight - cornerSize);
        ctx.closePath();
        ctx.fill();

        // Tanda Seri Arsip Cetak Mesin Tik Antik
        drawRoundedRectPath(ctx, slotX + slotWidth - 68, yHerb + slotHeight - 22, 60, 18, 4);
        ctx.fillStyle = 'rgba(250, 247, 242, 0.9)';
        ctx.fill();
        ctx.fillStyle = '#8c7355';
        ctx.font = '800 11px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('NO. 0' + (h + 1), slotX + slotWidth - 38, yHerb + slotHeight - 9);
      }

      // Footer Jurnal Album Kenangan Rapat & Proporsional (Anti-Bolong Bawah)
      ctx.fillStyle = '#4a3f35';
      ctx.font = 'bold 26px "Playfair Display", Georgia, serif';
      ctx.textAlign = 'center';
      ctx.fillText('Catatan Kenangan Santri', canvas.width / 2, 1515);

      ctx.fillStyle = '#8c7b6b';
      ctx.font = 'italic 17px "Playfair Display", Georgia, serif';
      ctx.fillText('Lembar Khidmah Penghafal Al-Qur\'an', canvas.width / 2, 1550);

    /* =========================================================================
     * TEMPLATE 3: THE ROYAL DIPLOMATIC PRESS (NAVY - LIS BEVELED EMAS & ORNAMEN SUDUT KERAJAAN)
     * ========================================================================= */
    } else {
      ctx.fillStyle = '#071322';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Lis ganda kerajaan membulat halus
      drawRoundedRectPath(ctx, 16, 16, canvas.width - 32, canvas.height - 32, 28);
      ctx.lineWidth = 7;
      ctx.strokeStyle = '#f59e0b';
      ctx.stroke();

      drawRoundedRectPath(ctx, 24, 24, canvas.width - 48, canvas.height - 48, 22);
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#fef08a';
      ctx.stroke();

      // Ornamen Sudut Fleur-de-lis (⚜️) Simetris
      ctx.fillStyle = '#f59e0b';
      ctx.font = '28px serif';
      ctx.textAlign = 'center';
      ctx.fillText('⚜️', 52, 62);
      ctx.fillText('⚜️', canvas.width - 52, 62);

      // Header Diplomatik Megah & Padat
      ctx.fillStyle = '#f59e0b';
      ctx.font = '900 34px "Cinzel", "Playfair Display", Georgia, serif';
      ctx.textAlign = 'center';
      ctx.fillText('BES SAPA AL HIJRAH', canvas.width / 2, 94);

      ctx.fillStyle = '#cbd5e1';
      ctx.font = '700 16px "Plus Jakarta Sans", sans-serif';
      ctx.fillText('THE ROYAL DIPLOMATIC PRESS • 2026', canvas.width / 2, 128);

      // 3 Foto Piagam dengan Lis Beveled Emas & Ornamen Sudut Geometris Kerajaan
      for (var d = 0; d < 3; d++) {
        var yDip = startY + d * (slotHeight + gap);

        // Backplate beveled emas gelap membulat
        drawRoundedRectPath(ctx, slotX - 8, yDip - 8, slotWidth + 16, slotHeight + 16, 22);
        ctx.fillStyle = '#060e19';
        ctx.fill();
        ctx.lineWidth = 3.5;
        ctx.strokeStyle = '#f59e0b';
        ctx.stroke();

        // Lis satin emas dalam
        drawRoundedRectPath(ctx, slotX - 4, yDip - 4, slotWidth + 8, slotHeight + 8, 20);
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(254, 240, 138, 0.5)';
        ctx.stroke();

        // Render foto membulat halus
        drawRoundedImage(ctx, imgs[d], slotX, yDip, slotWidth, slotHeight, photoRadius);

        // 4 Ornamen Sudut Geometris Kerajaan Emas Murni (Royal Corner Brackets)
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = '#fef08a';
        var bLen = 22;
        var bIns = 10;
        // Top-Left
        ctx.beginPath();
        ctx.moveTo(slotX + bIns, yDip + bIns + bLen);
        ctx.lineTo(slotX + bIns, yDip + bIns);
        ctx.lineTo(slotX + bIns + bLen, yDip + bIns);
        ctx.stroke();
        // Top-Right
        ctx.beginPath();
        ctx.moveTo(slotX + slotWidth - bIns - bLen, yDip + bIns);
        ctx.lineTo(slotX + slotWidth - bIns, yDip + bIns);
        ctx.lineTo(slotX + slotWidth - bIns, yDip + bIns + bLen);
        ctx.stroke();
        // Bottom-Left
        ctx.beginPath();
        ctx.moveTo(slotX + bIns, yDip + slotHeight - bIns - bLen);
        ctx.lineTo(slotX + bIns, yDip + slotHeight - bIns);
        ctx.lineTo(slotX + bIns + bLen, yDip + slotHeight - bIns);
        ctx.stroke();
        // Bottom-Right
        ctx.beginPath();
        ctx.moveTo(slotX + slotWidth - bIns - bLen, yDip + slotHeight - bIns);
        ctx.lineTo(slotX + slotWidth - bIns, yDip + slotHeight - bIns);
        ctx.lineTo(slotX + slotWidth - bIns, yDip + slotHeight - bIns - bLen);
        ctx.stroke();
      }

      // Footer Resmi Berwibawa Rapat & Proporsional (Anti-Bolong Bawah)
      ctx.fillStyle = '#f59e0b';
      ctx.font = 'bold 24px "Cinzel", "Playfair Display", Georgia, serif';
      ctx.textAlign = 'center';
      ctx.fillText('OFFICIAL EXECUTIVE MEMORABILIA', canvas.width / 2, 1515);

      ctx.fillStyle = '#94a3b8';
      ctx.font = '600 16px "Plus Jakarta Sans", sans-serif';
      ctx.fillText('Mahkota Khidmah Generasi Qur\'ani', canvas.width / 2, 1550);
    }

    var link = document.createElement('a');
    link.download = 'BES_AlHijrah_' + template + '_' + Date.now() + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    showToast('Strip foto berhasil diunduh!', 'success');
  }

  function showToast(message, type) {
    var container = document.getElementById('toastContainer');
    if (!container) return;

    var toast = document.createElement('div');
    var bgClass = (type === 'success') ? 'bg-hydrangea-800 text-white' : (type === 'warning' ? 'bg-rose-600 text-white' : 'bg-slate-900 text-white');
    var icon = (type === 'success') ? '✅' : (type === 'warning' ? '⚠️' : '✨');

    toast.className = 'px-4 py-2 rounded-xl shadow-lg flex items-center gap-2 text-xs font-semibold ' + bgClass;
    toast.innerHTML = '<span>' + icon + '</span><span>' + message + '</span>';

    container.appendChild(toast);
    setTimeout(function() {
      if (toast.parentNode) toast.parentNode.removeChild(toast);
    }, 3500);
  }

  window.addEventListener('scroll', handleNavbarScroll);
  window.addEventListener('resize', updateNavUnderline);

  window.addEventListener('DOMContentLoaded', function() {
    try {
      var cachedKicker = localStorage.getItem('bes_loading_kicker');
      var cachedTitle = localStorage.getItem('bes_loading_title');
      var cachedTagline = localStorage.getItem('bes_loading_tagline');
      if (cachedKicker) setElementTextSafely('loadingKicker', cachedKicker);
      if (cachedTitle) setElementTextSafely('loadingBrandTitle', cachedTitle);
      if (cachedTagline) setElementTextSafely('loadingTagline', cachedTagline);
    } catch (eCacheGet) {}

    try { initApplicationData(); } catch (e1) { console.warn('Guardrail data:', e1); }
    try { initThreeWebGLAtmosphere(); } catch (e2) { console.warn('Guardrail 3D WebGL:', e2); }
    try { initSilkTilt(); } catch (e3) { console.warn('Guardrail tilt:', e3); }
    try { initScrollReveal(); } catch (e4) { console.warn('Guardrail reveal:', e4); }
    setTimeout(function() { try { updateNavUnderline(); } catch (e5) { console.warn('Guardrail underline:', e5); } }, 250);

    setTimeout(function() {
      dismissLoadingScreen();
    }, 3000);
  });
