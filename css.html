<style>
  :root {
    --theme-bg-gradient: radial-gradient(130% 115% at 50% 18%, #ffffff 0%, #f0f7fe 28%, #d8ebfd 52%, #b0d5fa 78%, #84baf2 100%);
    --color-slate-950: #081321;
    --color-slate-900: #0f1f33;
    --color-slate-800: #183354;
    --color-hydrangea-700: #244b78;
    --color-hydrangea-600: #32649a;
    --color-hydrangea-500: #447ab8;
    --color-hydrangea-400: #6ea2db;
    --color-powder-ice: #a3caf6;
    --color-warm-linen: #f4efe6;
    --color-gold-seal: #f59e0b;
    --color-gold-radiance: #fbbf24;
    --surface-silk-pearl: rgba(255, 255, 255, 0.96);
    --surface-silk-border: rgba(110, 162, 219, 0.55);
    --surface-silk-shadow: 0 20px 48px -10px rgba(15, 31, 51, 0.16);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background-color: #dbeafe;
    color: #12253c;
    overflow-x: hidden;
  }

  .celestial-loading-screen {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(circle at 50% 45%, #0e1e38 0%, #0c1b2e 40%, #071220 80%, #03070d 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity 0.85s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.85s ease;
    overflow: hidden;
    user-select: none;
  }

  .celestial-loading-screen.loading-dismissed {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .loading-ambient-halo {
    position: absolute;
    width: 380px;
    height: 380px;
    background: radial-gradient(circle, rgba(74, 132, 196, 0.28) 0%, rgba(245, 158, 11, 0.12) 45%, transparent 70%);
    filter: blur(40px);
    border-radius: 9999px;
    animation: haloBreathe 4s ease-in-out infinite alternate;
    pointer-events: none;
  }

  @keyframes haloBreathe {
    0% { transform: scale(0.85); opacity: 0.5; }
    100% { transform: scale(1.2); opacity: 0.95; }
  }

  .loading-crystal-container {
    position: relative;
    width: 130px;
    height: 130px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
  }

  .loading-orbit-ring {
    position: absolute;
    border-radius: 50%;
    border: 1.5px dashed rgba(245, 158, 11, 0.55);
    box-shadow: 0 0 16px rgba(245, 158, 11, 0.2);
  }

  .loading-orbit-ring.ring-outer {
    width: 124px;
    height: 124px;
    border-top-color: #f59e0b;
    border-left-color: #6ea2db;
    animation: orbitSpin 8s linear infinite;
  }

  .loading-orbit-ring.ring-middle {
    width: 96px;
    height: 96px;
    border: 1.5px solid rgba(163, 202, 246, 0.45);
    border-bottom-color: #f59e0b;
    animation: orbitSpinReverse 5s linear infinite;
  }

  @keyframes orbitSpin {
    0% { transform: rotate(0deg) scale(1); }
    50% { transform: rotate(180deg) scale(1.04); }
    100% { transform: rotate(360deg) scale(1); }
  }

  @keyframes orbitSpinReverse {
    0% { transform: rotate(360deg); }
    100% { transform: rotate(0deg); }
  }

  .loading-crystal-core {
    position: relative;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: crystalCoreLevitate 3.2s ease-in-out infinite;
  }

  @keyframes crystalCoreLevitate {
    0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
    50% { transform: translateY(-7px) rotate(4deg) scale(1.08); }
  }

  .loading-polyhedron-svg {
    width: 54px !important;
    height: 54px !important;
    max-width: 54px !important;
    max-height: 54px !important;
    color: #a3caf6;
    filter: drop-shadow(0 0 20px rgba(163, 202, 246, 0.95)) drop-shadow(0 0 8px #ffffff);
  }

  .loading-stardust-pulse {
    position: absolute;
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(245, 158, 11, 0.25) 0%, transparent 65%);
    animation: stardustPulse 2.5s ease-out infinite;
    pointer-events: none;
  }

  @keyframes stardustPulse {
    0% { transform: scale(0.6); opacity: 0.8; }
    100% { transform: scale(1.4); opacity: 0; }
  }

  .loading-title-box {
    text-align: center;
    margin-bottom: 24px;
    z-index: 5;
  }

  .loading-kicker {
    font-family: 'Cinzel Decorative', 'Playfair Display', serif;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.36em;
    color: #a3caf6;
    margin-bottom: 4px;
    text-shadow: 0 0 10px rgba(163, 202, 246, 0.5);
  }

  .loading-brand-title {
    font-family: 'Cinzel Decorative', 'Playfair Display', serif;
    font-size: 1.65rem;
    font-weight: 900;
    letter-spacing: 0.14em;
    color: #ffffff;
    margin: 0;
    background: linear-gradient(135deg, #ffffff 20%, #f59e0b 60%, #93c5fd 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 14px rgba(245, 158, 11, 0.35));
  }

  .loading-tagline {
    font-size: 9.5px;
    font-weight: 800;
    letter-spacing: 0.38em;
    color: #94a3b8;
    margin-top: 6px;
  }

  .loading-track-wrapper {
    width: 220px;
    height: 4px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 999px;
    overflow: hidden;
    position: relative;
    border: 1px solid rgba(163, 202, 246, 0.2);
    box-shadow: 0 0 12px rgba(0, 0, 0, 0.35);
    z-index: 5;
  }

  .loading-track-beam {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 35%;
    background: linear-gradient(90deg, transparent 0%, #386fa8 30%, #f59e0b 70%, #ffffff 100%);
    border-radius: 999px;
    box-shadow: 0 0 14px rgba(245, 158, 11, 0.85);
    animation: trackBeamSweep 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }

  @keyframes trackBeamSweep {
    0% { left: -40%; width: 30%; }
    50% { width: 55%; }
    100% { left: 100%; width: 30%; }
  }

  .royal-silk-atmosphere {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: -1;
    overflow: hidden;
    pointer-events: none !important;
    background: radial-gradient(circle at 50% 38%, #ffffff 0%, #f2f8fe 22%, #d6ebfd 50%, #9fcbf7 78%, #6d9ed8 100%);
  }

  .webgl-interactive-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none !important;
    display: block;
  }

  .sacred-vignette-overlay {
    position: absolute;
    inset: 0;
    background: 
      radial-gradient(ellipse at 50% 45%, transparent 30%, rgba(36, 75, 122, 0.14) 70%, rgba(18, 37, 60, 0.28) 100%),
      radial-gradient(circle at 50% 18%, rgba(245, 158, 11, 0.08) 0%, transparent 55%),
      linear-gradient(180deg, rgba(255, 255, 255, 0.5) 0%, transparent 35%, rgba(24, 51, 84, 0.18) 100%);
    pointer-events: none !important;
    z-index: 2;
  }

  .wide-silk-nav-capsule {
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.96) 0%, rgba(240, 248, 255, 0.92) 45%, rgba(224, 240, 254, 0.88) 100%);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1.5px solid rgba(110, 162, 219, 0.75);
    box-shadow: 0 14px 40px -8px rgba(18, 37, 60, 0.16), 0 2px 8px rgba(0, 0, 0, 0.04);
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .wide-silk-nav-capsule.navbar-scrolled {
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.68) 0%, rgba(235, 246, 254, 0.55) 50%, rgba(210, 235, 254, 0.48) 100%) !important;
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border-color: rgba(110, 162, 219, 0.6);
    box-shadow: 0 16px 42px -8px rgba(18, 37, 60, 0.18), 0 2px 6px rgba(0, 0, 0, 0.03);
  }

  .nav-link-item {
    color: #386fa8;
    position: relative;
    cursor: pointer;
    user-select: none;
    transition: color 0.25s ease;
  }

  .nav-link-item:hover { color: #0e1e38; }

  .nav-link-item.active-nav-link {
    color: #0e1e38;
    font-weight: 900;
  }

  .nav-sliding-underline {
    position: absolute;
    bottom: -4px;
    left: 0;
    width: 0;
    height: 3.5px;
    background: linear-gradient(90deg, #4a84c4 0%, #1c3b5e 50%, #4a84c4 100%);
    border-radius: 999px;
    box-shadow: 0 0 14px rgba(74, 132, 196, 0.8);
    transition: left 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), width 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
  }

  .scroll-progress-bar {
    position: fixed;
    top: 0;
    left: 0;
    width: 0%;
    height: 3.5px;
    background: linear-gradient(90deg, #386fa8 0%, #6ea2db 45%, #f59e0b 85%, #fef08a 100%);
    box-shadow: 0 0 14px rgba(245, 158, 11, 0.85), 0 0 5px rgba(56, 111, 168, 0.7);
    z-index: 100;
    transition: width 0.12s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none;
  }

  .page-section {
    display: none;
    opacity: 0;
    transition: opacity 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    will-change: opacity;
  }

  .page-section.active-page {
    display: flex;
    opacity: 1;
  }

  .page-section.page-exiting {
    display: flex !important;
    opacity: 0 !important;
    pointer-events: none;
  }

  #page-home {
    height: 100vh;
    max-height: 100vh;
    overflow: hidden;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
  }

  .aesthetic-ornamental-title {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    padding: 8px 4px;
    animation: titleBreatheLevitate 6s ease-in-out infinite;
    will-change: transform;
    max-width: 100vw;
  }

  @keyframes titleBreatheLevitate {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-7px); }
  }

  .title-ambient-halo {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 130%;
    height: 140%;
    background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.98) 0%, rgba(234, 243, 252, 0.85) 45%, rgba(197, 224, 250, 0.25) 75%, transparent 100%);
    filter: blur(28px);
    border-radius: 999px;
    z-index: 1;
    pointer-events: none;
  }

  .title-kicker-bes {
    font-family: 'Cinzel', 'Playfair Display', serif;
    font-weight: 900;
    font-size: clamp(1.25rem, 5vw, 1.85rem);
    letter-spacing: clamp(0.38em, 1.5vw, 0.65em);
    text-transform: uppercase;
    color: #244b78;
    margin-bottom: 4px;
    position: relative;
    z-index: 2;
    text-shadow: 0 2px 10px rgba(36, 75, 120, 0.15);
  }

  .title-main-alhijrah {
    position: relative;
    display: inline-block;
    padding: 0 4px;
    z-index: 2;
    margin: 0;
    white-space: nowrap !important;
    overflow: visible;
  }

  /* Font Hero Utama: Besar, Gagah, dan Terkunci 1 Baris Penuh di Desktop maupun HP */
  .title-text-gradient {
    font-family: 'Cinzel', 'Playfair Display', serif;
    font-weight: 900;
    font-size: clamp(3.1rem, 13.6vw, 5.65rem);
    letter-spacing: clamp(0.015em, 0.7vw, 0.12em);
    line-height: 1.08;
    text-transform: uppercase;
    white-space: nowrap !important;
    background: linear-gradient(
      115deg,
      #091524 0%,
      #12253c 20%,
      #244b78 35%,
      #f59e0b 46%,
      #ffffff 50%,
      #f59e0b 54%,
      #244b78 65%,
      #12253c 80%,
      #091524 100%
    );
    background-size: 250% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 6px 18px rgba(12, 27, 46, 0.22));
    display: inline-block;
    animation: glyphContourShimmer 6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    will-change: background-position;
  }

  @keyframes glyphContourShimmer {
    0%, 25% { background-position: 100% 50%; }
    65%, 100% { background-position: 0% 50%; }
  }

  .title-year-frame {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-top: 6px;
    position: relative;
    z-index: 2;
  }

  .year-flanking-hairline {
    width: clamp(30px, 7vw, 90px);
    height: 1.5px;
    background: linear-gradient(90deg, transparent 0%, #f59e0b 100%);
    border-radius: 999px;
  }

  .title-year-frame .year-flanking-hairline:last-child {
    background: linear-gradient(90deg, #f59e0b 0%, transparent 100%);
  }

  .title-year-number {
    font-family: 'Cinzel', 'Playfair Display', serif;
    font-weight: 800;
    font-size: clamp(1.8rem, 7.2vw, 3.4rem);
    letter-spacing: clamp(0.25em, 1vw, 0.5em);
    line-height: 1;
    color: #1c3b5e;
    background: linear-gradient(135deg, #1c3b5e 0%, #386fa8 60%, #b45309 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 8px rgba(40, 83, 130, 0.22));
  }

  #page-photobooth {
    height: 100vh;
    height: 100dvh;
    max-height: 100dvh;
    overflow: hidden;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 8px 12px;
    gap: 6px;
  }

  .photobooth-top-bar {
    margin-bottom: 2px;
  }

  .carousel-stage-wrapper {
    position: relative;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1200px;
    flex: 0 0 auto;
    min-height: 0;
    margin: 2px 0;
  }

  .carousel-strip-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    max-width: 920px;
    transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .carousel-strip-item {
    position: relative;
    width: 184px;
    height: 405px;
    border-radius: 18px;
    padding: 9px;
    cursor: pointer;
    transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.5s ease, filter 0.5s ease, box-shadow 0.5s ease;
    user-select: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    flex-shrink: 0;
    will-change: transform, opacity;
  }

  @media (min-height: 700px) and (max-width: 639px) {
    .carousel-strip-item { width: 196px; height: 428px; padding: 10px; }
  }

  @media (min-width: 640px) {
    .carousel-strip-item { width: 228px; height: 498px; padding: 12px; }
  }
  @media (min-width: 1024px) {
    .carousel-strip-item { width: 245px; height: 520px; padding: 14px; }
  }

  .carousel-strip-item.item-side {
    transform: scale(0.85) translateZ(-40px);
    opacity: 0.52;
    filter: brightness(0.92);
    z-index: 10;
  }

  .carousel-strip-item.item-side:hover {
    opacity: 0.82;
    transform: scale(0.89) translateZ(-20px);
    filter: none;
  }

  .carousel-strip-item.item-center {
    transform: scale(1.04) translateZ(30px);
    opacity: 1;
    filter: none;
    z-index: 25;
    box-shadow: 0 24px 48px -8px rgba(18, 37, 60, 0.35);
    cursor: default;
  }

  .strip-slots-box {
    display: flex;
    flex-direction: column;
    gap: 3px;
    width: 100%;
  }

  /* Celah Alami Antar Foto 1, 2, dan 3 (Clean Gap Tanpa Sumbatan Emotikon/Divider Teks) */
  .clean-slots-gap {
    gap: 6px !important;
  }

  .frame-photo-slot {
    width: 100%;
    height: 90px;
    border-radius: 9px;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #081321;
  }

  @media (min-height: 700px) and (max-width: 639px) {
    .frame-photo-slot { height: 96px; }
  }
  @media (min-width: 640px) { .frame-photo-slot { height: 114px; } }
  @media (min-width: 1024px) { .frame-photo-slot { height: 120px; } }

  .frame-photo-slot video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
  }
  
  .frame-photo-slot img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .analog-film-theme {
    background: linear-gradient(168deg, #e0f2fe 0%, #bae6fd 45%, #7dd3fc 100%) !important;
    border: 3.5px solid #0284c7 !important;
    color: #0c4a6e !important;
    box-shadow: 0 18px 45px rgba(2, 132, 199, 0.35), 0 0 20px rgba(186, 230, 253, 0.5) !important;
    overflow: hidden;
  }

  .film-perforation-strip {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 6px;
    z-index: 15;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 6px,
      rgba(14, 74, 110, 0.38) 6px,
      rgba(14, 74, 110, 0.38) 11px,
      transparent 11px,
      transparent 17px
    );
  }

  .perf-left { left: 3px; }
  .perf-right { right: 3px; }

  .viewfinder-bracket {
    position: absolute;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    font-weight: 900;
    color: #0284c7;
    z-index: 20;
    pointer-events: none;
    line-height: 1;
    text-shadow: 0 0 4px rgba(255, 255, 255, 0.9);
  }

  .bracket-tl { top: 3px; left: 4px; }
  .bracket-tr { top: 3px; right: 4px; }
  .bracket-bl { bottom: 3px; left: 4px; }
  .bracket-br { bottom: 3px; right: 4px; }

  .viewfinder-strip-divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    margin: 2px 0;
    user-select: none;
  }

  .viewfinder-strip-divider .vf-line {
    flex: 1;
    height: 1px;
    background: rgba(2, 132, 199, 0.45);
    border-radius: 999px;
  }

  .viewfinder-strip-divider .vf-badge {
    font-size: 7px;
    color: #0369a1;
    font-weight: 900;
    letter-spacing: 0.1em;
    background: rgba(255, 255, 255, 0.85);
    padding: 1px 5px;
    border-radius: 4px;
    border: 0.5px solid rgba(2, 132, 199, 0.35);
    box-shadow: 0 1px 4px rgba(2, 132, 199, 0.12);
  }

  .haru-polaroid-slot {
    background-color: #ffffff !important;
    border: 2.5px solid #ffffff !important;
    border-radius: 9px !important;
    box-shadow: 0 4px 12px rgba(14, 165, 233, 0.22) !important;
  }

  .herbarium-journal-theme {
    background: radial-gradient(circle at 50% 30%, #fdfbf7 0%, #f5eee2 60%, #eaddcc 100%) !important;
    border: 3.5px solid #c8b79f !important;
    color: #2c251e !important;
    box-shadow: 0 18px 45px rgba(80, 60, 40, 0.18), inset 0 0 40px rgba(190, 165, 130, 0.18) !important;
    overflow: hidden;
  }

  .washi-tape-strip {
    position: absolute;
    width: 44px;
    height: 14px;
    background: repeating-linear-gradient(45deg, rgba(214, 196, 174, 0.85), rgba(214, 196, 174, 0.85) 4px, rgba(235, 222, 204, 0.85) 4px, rgba(235, 222, 204, 0.85) 8px);
    backdrop-filter: blur(4px);
    border: 1px dashed rgba(160, 140, 115, 0.7);
    pointer-events: none;
    z-index: 20;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.12);
  }

  .washi-top-left { top: 5px; left: 12px; transform: rotate(-8deg); }
  .washi-bottom-right { bottom: 6px; right: 12px; transform: rotate(6deg); }

  .scrapbook-stamp-seal {
    position: absolute;
    top: 5px;
    right: 10px;
    font-size: 7.5px;
    font-weight: 900;
    padding: 1px 5px;
    border-radius: 4px;
    background: rgba(220, 38, 38, 0.12);
    border: 1.5px solid rgba(220, 38, 38, 0.45);
    color: #b91c1c;
    transform: rotate(10deg);
    pointer-events: none;
    user-select: none;
    letter-spacing: 0.05em;
    z-index: 20;
  }

  /* Efek Matting Kertas Seni Timbul (Passe-Partout Paper Matting) */
  .vintage-matting-slot {
    background-color: #faf7f2 !important;
    border: 2px solid #d4c5b2 !important;
    border-radius: 9px !important;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.18), 0 3px 10px rgba(60, 45, 30, 0.12) !important;
  }

  /* Siku Penyangga Foto Fisik Album Antik (Vintage Photo Mounting Corners) */
  .vintage-mounting-corner {
    position: absolute;
    width: 14px;
    height: 14px;
    z-index: 22;
    pointer-events: none;
  }

  .vmc-tl {
    top: 0; left: 0;
    background: linear-gradient(135deg, #8c7355 52%, transparent 52%);
    border-top-left-radius: 7px;
  }

  .vmc-tr {
    top: 0; right: 0;
